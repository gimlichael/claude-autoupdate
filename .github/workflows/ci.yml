name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell tests
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1
      - name: Run isolated tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/Update-Claude.Tests.ps1
